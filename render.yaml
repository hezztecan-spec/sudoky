# Render Blueprint: Postgres + Node API + статический фронт
# Подключи репо на https://dashboard.render.com/blueprints

databases:
  - name: sudoku-db
    databaseName: sudoku_championship
    user: sudoku
    plan: free
    postgresMajorVersion: 16

services:
  # Backend (Express + WebSocket)
  - type: web
    name: sudoku-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: node src/migrate.js && node src/seed.js && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WORKER_SECRET
        generateValue: true       # ВАЖНО: после деплоя скопируй значение в whatsapp-worker/.env
      - key: ADMIN_PHONE
        sync: false               # впиши свой номер в дашборде, например +79991234567
      - key: DATABASE_URL
        fromDatabase:
          name: sudoku-db
          property: connectionString

  # Frontend (Vite static site)
  - type: web
    name: sudoku-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false               # впиши https://sudoku-api-xxxx.onrender.com/api
      - key: VITE_WS_URL
        sync: false               # впиши wss://sudoku-api-xxxx.onrender.com/ws
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
