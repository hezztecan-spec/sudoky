# Шаблон конфига Cloudflare Tunnel.
# Скопируй в ~/.cloudflared/config.yml после `cloudflared tunnel create sudoku`
# и замени <TUNNEL_ID> и <DOMAIN> на свои значения.

tunnel: sudoku
credentials-file: /Users/mansur/.cloudflared/<TUNNEL_ID>.json

ingress:
  # API
  - hostname: <DOMAIN>
    path: /api/*
    service: http://localhost:4000

  # WebSocket
  - hostname: <DOMAIN>
    path: /ws*
    service: http://localhost:4000

  # Всё остальное → фронт
  - hostname: <DOMAIN>
    service: http://localhost:5173

  - service: http_status:404
