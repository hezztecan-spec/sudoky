version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sudoku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sudoku}
      POSTGRES_DB: ${POSTGRES_DB:-sudoku_championship}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sudoku}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://sudoku:sudoku@db:5432/sudoku_championship}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      WORKER_SECRET: ${WORKER_SECRET:-dev_worker_secret_change_me}
    ports:
      - "4000:4000"
    command: sh -c "node src/migrate.js && node src/seed.js && node src/index.js"

  # whatsapp-воркер локально не запускаем — он живёт на твоём ноуте вне докера.
  # frontend для локальной разработки:
  #   cd frontend && npm run dev

volumes:
  db_data:
